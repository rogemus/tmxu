name: Tag Releases

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          go vet ./...

      - name: Format check
        run: |
          test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }

      - name: Tests
        run: |
          go test -race ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set archive name
        run: |
          echo "NAME=tmxu_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "$NAME"
          go build -trimpath -ldflags "-X main.version=$VERSION" -o "$NAME/tmxu" .
          cp LICENSE README.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"

      - name: Upload archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum tmxu_*.tar.gz > checksums.txt

          gh release create "$TAG" --generate-notes tmxu_*.tar.gz checksums.txt
