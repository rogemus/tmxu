name: Setup
description: Set up Go from go.mod and download dependencies

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod

    - name: Download dependencies
      shell: bash
      run: |
        go mod download
