name: Setup
description: Set up Go from go.mod and download dependencies

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: Download dependencies
      shell: bash
      run: |
        go mod download
